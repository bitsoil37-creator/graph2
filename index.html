<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Graph</title>

    <!-- ChartJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Zoom Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.0/dist/chartjs-plugin-zoom.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Javascript -->
    <script defer src="main.js"></script>
</head>
<body>

    <h1>Soil Sensor Data</h1>
    <div class="chart-container">
        <div class="loading">Loading chart...</div>
        <canvas id="myChart"></canvas>
        <div class="gesture-hint">Pinch to zoom • Drag to pan • Double-tap to reset</div>
        <div class="pinch-feedback" id="pinchFeedback"></div>
    </div>

</body>
</html>
